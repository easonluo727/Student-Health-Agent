name: Run insurance estimator

# Allow the workflow to be started manually
on:
  workflow_dispatch:
    inputs:
      request:
        description: "Enter your insurance cost question"
        required: true
        default: "How much will I pay for an in-network blood test with a $100 allowed amount and $80 remaining deductible?"

# Define the work GitHub should perform
jobs:
  estimate:

    # Create a temporary Linux computer
    runs-on: ubuntu-latest

    steps:
      # Copy the repository files onto the temporary computer
      - name: Download repository
        uses: actions/checkout@v7

      # Install and activate Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # Install packages listed in requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run the insurance estimator
      - name: Run estimator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          USER_REQUEST: ${{ inputs.request }}
        run: |
          printf '%s\n' "$USER_REQUEST" | python estimate_multiple.py
